<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Expense Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- 1. LOGIN & REGISTRATION SCREEN -->
  <div id="authSection" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-2xl shadow-lg">
    <h1 class="text-2xl font-bold text-center text-indigo-600 mb-2">Expense Tracker Portal</h1>
    <p class="text-sm text-center text-slate-500 mb-6">Register a new account or log in to view your expenses</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Your Name or Email</label>
        <input id="usernameInput" type="text" placeholder="e.g. rahul"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input id="passwordInput" type="password" placeholder="Enter password"
          class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <p id="authMessage" class="text-sm hidden"></p>
      <div class="flex gap-3 pt-2">
        <button onclick="handleAuth('login')"
          class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
          Log In
        </button>
        <button onclick="handleAuth('register')"
          class="w-1/2 bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg transition">
          Register New User
        </button>
      </div>
    </div>
  </div>

  <!-- 2. MAIN EXPENSE DASHBOARD -->
  <div id="appSection" class="max-w-4xl mx-auto my-10 px-4 hidden">
    <!-- Top Bar -->
    <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-wrap justify-between items-center gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Daily Expense Sheet</h1>
        <p class="text-sm text-slate-500">Account: <span id="currentUserDisplay" class="font-semibold text-indigo-600"></span></p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="exportToCSV()"
          class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm transition">
          📥 Export Sheet (Excel / CSV)
        </button>
        <button onclick="logout()"
          class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium px-4 py-2.5 rounded-lg transition">
          Logout
        </button>
      </div>
    </div>

    <!-- Add Expense Form -->
    <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
      <h2 class="text-lg font-semibold mb-4">Write New Expense</h2>
      <form onsubmit="addExpense(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Serial No. (Auto)</label>
          <input id="nextSerialPreview" type="text" disabled
            class="w-full bg-slate-100 border border-slate-200 text-slate-500 rounded-lg px-3 py-2 font-mono font-bold" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Where Expensed</label>
          <input id="expenseName" type="text" required placeholder="e.g. Tea, Bus Fare, Lunch"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Money Expensed</label>
          <input id="expenseAmount" type="number" step="0.01" min="0.01" required placeholder="0.00"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Date (Auto-Set)</label>
          <div class="flex gap-2">
            <input id="expenseDate" type="text" disabled
              class="w-full bg-slate-100 border border-slate-200 text-slate-600 rounded-lg px-3 py-2 text-sm" />
            <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-lg transition shrink-0">
              + Save
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Expense Table -->
    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-lg font-semibold">Stored Expenses (Day by Day)</h2>
        <div class="text-sm font-medium text-slate-600">
          Grand Total: <span id="totalAmountDisplay" class="text-lg font-bold text-indigo-600">0.00</span>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
              <th class="py-3.5 px-4 w-28">Serial No.</th>
              <th class="py-3.5 px-4">Where Expensed</th>
              <th class="py-3.5 px-4">Money Expensed</th>
              <th class="py-3.5 px-4">Date</th>
              <th class="py-3.5 px-4 text-right">Remove</th>
            </tr>
          </thead>
          <tbody id="expenseTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    // Automatically get today's date (YYYY-MM-DD)
    function getTodayDate() {
      const today = new Date();
      return today.toISOString().split('T')[0];
    }

    function getUsers() {
      return JSON.parse(localStorage.getItem('portal_users') || '{}');
    }

    function getUserExpenses() {
      if (!currentUser) return [];
      const allExpenses = JSON.parse(localStorage.getItem('portal_expenses') || '{}');
      return allExpenses[currentUser] || [];
    }

    function saveUserExpenses(expenses) {
      const allExpenses = JSON.parse(localStorage.getItem('portal_expenses') || '{}');
      allExpenses[currentUser] = expenses;
      localStorage.setItem('portal_expenses', JSON.stringify(allExpenses));
    }

    // Handle Registration and Login
    function handleAuth(mode) {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;
      const msgEl = document.getElementById('authMessage');
      msgEl.className = 'text-sm text-red-500';

      if (!username || !password) {
        msgEl.textContent = 'Please fill in both fields.';
        msgEl.classList.remove('hidden');
        return;
      }

      const users = getUsers();

      if (mode === 'register') {
        if (users[username]) {
          msgEl.textContent = 'This user already exists! Click Log In instead.';
          msgEl.classList.remove('hidden');
          return;
        }
        users[username] = { password };
        localStorage.setItem('portal_users', JSON.stringify(users));
      } else {
        if (!users[username] || users[username].password !== password) {
          msgEl.textContent = 'Wrong username or password. If you are new, click Register New User.';
          msgEl.classList.remove('hidden');
          return;
        }
      }

      currentUser = username;
      msgEl.classList.add('hidden');
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('appSection').classList.remove('hidden');
      document.getElementById('currentUserDisplay').textContent = currentUser;
      document.getElementById('expenseDate').value = getTodayDate();
      renderExpenses();
    }

    function logout() {
      currentUser = null;
      document.getElementById('usernameInput').value = '';
      document.getElementById('passwordInput').value = '';
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('authSection').classList.remove('hidden');
    }

    function addExpense(e) {
      e.preventDefault();
      const nameInput = document.getElementById('expenseName');
      const amountInput = document.getElementById('expenseAmount');

      const expenses = getUserExpenses();
      expenses.push({
        id: Date.now().toString(),
        name: nameInput.value.trim(),
        amount: parseFloat(amountInput.value),
        date: getTodayDate()
      });

      saveUserExpenses(expenses);
      nameInput.value = '';
      amountInput.value = '';
      nameInput.focus();
      renderExpenses();
    }

    function deleteExpense(id) {
      const expenses = getUserExpenses().filter(item => item.id !== id);
      saveUserExpenses(expenses);
      renderExpenses();
    }

    // Displays expenses grouped day-by-day with auto-modifying Serial No.
    function renderExpenses() {
      const expenses = getUserExpenses();
      const tbody = document.getElementById('expenseTableBody');
      tbody.innerHTML = '';

      // Automatically set the next Serial No. in the top box
      document.getElementById('nextSerialPreview').value = expenses.length + 1;

      let grandTotal = 0;

      if (expenses.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-8 text-center text-slate-400">
              No expenses added yet. Write your first expense above!
            </td>
          </tr>`;
        document.getElementById('totalAmountDisplay').textContent = '0.00';
        return;
      }

      let lastDate = null;

      expenses.forEach((item, index) => {
        const serialNo = index + 1; // Always 1, 2, 3... automatically adjusts if deleted
        grandTotal += item.amount;

        // Add a Day Header Row whenever the date changes
        if (item.date !== lastDate) {
          lastDate = item.date;
          const dayHeader = document.createElement('tr');
          dayHeader.className = 'bg-indigo-50/60';
          dayHeader.innerHTML = `
            <td colspan="5" class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-indigo-700">
              📅 Date: ${item.date}
            </td>
          `;
          tbody.appendChild(dayHeader);
        }

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-50 transition';
        row.innerHTML = `
          <td class="py-3 px-4 font-mono font-semibold text-slate-600">${serialNo}</td>
          <td class="py-3 px-4 font-medium text-slate-800">${escapeHTML(item.name)}</td>
          <td class="py-3 px-4 font-semibold text-emerald-700">${item.amount.toFixed(2)}</td>
          <td class="py-3 px-4 text-slate-500">${item.date}</td>
          <td class="py-3 px-4 text-right">
            <button onclick="deleteExpense('${item.id}')"
              class="text-red-500 hover:text-red-700 text-xs font-medium px-2 py-1 rounded hover:bg-red-50 transition">
              Delete
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('totalAmountDisplay').textContent = grandTotal.toFixed(2);
    }

    // Export to CSV (Opens cleanly in Microsoft Excel or Google Sheets)
    function exportToCSV() {
      const expenses = getUserExpenses();
      if (expenses.length === 0) {
        alert('Please add at least one expense before exporting!');
        return;
      }

      let csvContent = 'Serial No.,Where Expensed,Money Expensed,Date\n';
      let total = 0;

      expenses.forEach((item, index) => {
        const serialNo = index + 1;
        total += item.amount;
        const cleanName = '"' + item.name.replace(/"/g, '""') + '"';
        csvContent += `${serialNo},${cleanName},${item.amount.toFixed(2)},${item.date}\n`;
      });

      csvContent += `\n,TOTAL EXPENSED,${total.toFixed(2)},\n`;

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `Expense_Sheet_${currentUser}_${getTodayDate()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }
  </script>
</body>
</html>
